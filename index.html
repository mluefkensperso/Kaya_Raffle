<style>
  :root {
    --blue: #000091;          /* Bleu France */
    --red: #e1000f;           /* Rouge Marianne */
    --red-press: #b8000c;
    --white: #ffffff;
    --page: #f4f6ff;
    --surface: #ffffff;

    --taken: #e7e9f7;
    --taken-ink: #a3a7c4;

    --ball: #f9faff; --ball-edge: #dde1f5; --seam: rgba(0, 0, 145, .2);
    --ball-sel: #000091; --ball-sel-hi: #3446e0; --seam-sel: rgba(255, 255, 255, .38);
    --post: #b9bedb;
    --err: #c4000d;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    --condensed: 72%;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #06062b;
      --surface: #0e0f45;
      --ink: #eef0ff;
      --muted: #a2a6d0;
      --line: #252873;
      --taken: #15175a;
      --taken-ink: #4b4f93;
      --sel: #ffffff;
      --sel-ink: #000091;
      --red: #ff2f3c;
      --red-press: #e1000f;
      --err: #ff6b74;
      --ball: #f4f5ff; --ball-edge: #c9cdea; --seam: rgba(0, 0, 145, .22);
      --ball-sel: #2f4dff; --ball-sel-hi: #7d93ff; --seam-sel: rgba(255, 255, 255, .45);
      --post: #4a4f95;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; background: var(--page); color: var(--ink); }
  body { font-family: Archivo, system-ui, sans-serif; font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  button, a, label, [role="button"] { touch-action: manipulation; }
  button { -webkit-user-select: none; user-select: none; font-family: inherit; }
  img { display: block; max-width: 100%; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
  @media (min-width: 1040px) { .wrap { max-width: 1100px; padding: 0 28px; } }
  .display { font-stretch: var(--condensed); font-weight: 850; letter-spacing: -.01em; line-height: .98; text-wrap: balance; }

  /* ───────── Hero: the court ───────── */
  .hero { position: relative; overflow: hidden; background: #000091; color: #fff;
          padding: calc(14px + env(safe-area-inset-top, 0px)) 0 34px; }
  .court { position: absolute; inset: 10px; border: 2px solid var(--court-line); overflow: hidden; pointer-events: none;
           clip-path: inset(0 0 0 0); }
  .court i { position: absolute; display: block; border-color: var(--court-line); }
  .court .third { background: var(--court-line); }
  .court .centre { width: 64px; aspect-ratio: 1; border: 2px solid var(--court-line); border-radius: 50%; left: 50%; top: 50%; translate: -50% -50%; }
  .court .goal { aspect-ratio: 1; border: 2px solid var(--court-line); border-radius: 50%; }
  .court .post { width: 10px; height: 10px; border-radius: 50%; background: var(--court-line); }
  /* Portrait court (phones): thirds run across */
  .court .t1, .court .t2 { left: 0; right: 0; height: 2px; }
  .court .t1 { top: 33.333%; } .court .t2 { top: 66.666%; }
  .court .g1, .court .g2 { width: 62%; left: 50%; }
  .court .g1 { top: 0; translate: -50% -50%; } .court .g2 { bottom: 0; translate: -50% 50%; }
  .court .p1, .court .p2 { left: 50%; translate: -50% 0; }

  @media (min-width: 700px) {
    /* Landscape court: thirds run down */

    .court .t1 { left: 33.333%; } .court .t2 { left: 66.666%; }
    .court .g1, .court .g2 { width: auto; height: 62%; top: 50%; left: auto; }
    .court .g1 { left: 0; translate: -50% -50%; } .court .g2 { right: 0; translate: 50% -50%; }
    .court .p1, .court .p2 { top: 50%; translate: 0 -50%; left: auto; bottom: auto; }
    .court .p1 { left: 6px; } .court .p2 { right: 6px; }
  }
  @media (prefers-reduced-motion: no-preference) {

    @keyframes paint { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    @media (max-width: 699px) { @keyframes paint { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } } }
  }

  .hero .wrap { position: relative; }
  .topbar { display: flex; justify-content: flex-end; padding: 8px 6px 0; }
  .lang { display: inline-flex; padding: 3px; border-radius: 999px; background: rgba(255,255,255,.12); }
  .lang button { border: 0; background: none; color: rgba(255,255,255,.75); font: 600 14px/1 Archivo, sans-serif;

  .lang button[aria-pressed="true"] { background: #fff; color: #000091; }
  .hero-body { padding: 48px 6px 0; display: grid; grid-template-columns: minmax(0, 1fr) 40%; grid-template-areas: "title title" "info kaya"; column-gap: 8px; }
  .hero-title { grid-area: title; min-width: 0; }
  .hero h1 { font-size: clamp(44px, 12vw, 84px); margin: 0; }
  .hero-info { grid-area: info; min-width: 0; }
  .hero-kaya { grid-area: kaya; align-self: end; position: relative; width: 100%; max-width: 190px; justify-self: end; margin-right: -4px; padding-left: 6%; }
  .hero-fig { position: relative; }

  .hero-fig img { filter: drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff); -webkit-mask-image: linear-gradient(to bottom, #000 80%, transparent 99%); mask-image: linear-gradient(to bottom, #000 80%, transparent 99%); }
  .hero-kaya::after { display: none; }
  /* Total prize value, as a red sticker on the hero (same style as the ×3 on the Verbier card) */
  .hero-sticker { position: absolute; z-index: 3; top: 66%; right: -10px; margin: 0; width: 92px; height: 92px; border-radius: 50%; background: #e1000f; color: #fff;
                  border: 4px solid #fff; box-shadow: 0 8px 20px rgba(0, 0, 40, .35), 0 0 0 2px #e1000f; transform: rotate(-12deg);
                  display: grid; place-content: center; text-align: center; line-height: 1; }
  .hero-sticker b { display: block; font-stretch: 62%; font-weight: 900; font-size: 27px; letter-spacing: -.01em; white-space: nowrap; }
  .hero-sticker small { display: block; margin-top: 3px; font-weight: 800; font-size: 11.5px; letter-spacing: .02em; }
  @media (min-width: 700px) {
    .hero-sticker { width: 128px; height: 128px; top: -27%; right: -6px; border-width: 5px; }
  }
  @media (min-width: 1040px) {
    .hero-sticker { right: -46px; }
    .hero-sticker b { font-size: 37px; }
    .hero-sticker small { font-size: 15px; margin-top: 4px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .hero-kaya.ready .hero-sticker { animation: stick 520ms cubic-bezier(.34, 1.56, .64, 1) 1050ms both; }
    @keyframes stick { from { opacity: 0; transform: rotate(-30deg) scale(.4); } to { opacity: 1; transform: rotate(-12deg) scale(1); } }
  }
  .hero-kaya img { position: relative; z-index: 1; display: block; width: 100%; height: auto; }
  .hero-kaya::after { content: ""; position: absolute; z-index: 0; left: 14%; right: 8%; bottom: -5px; height: 14px; border-radius: 50%; background: rgba(0, 0, 40, .45); filter: blur(5px); }
  .hero-ball, .fly-ball { position: absolute; z-index: 0; aspect-ratio: 1; display: block; }
  .hero-ball { transition: opacity 300ms ease; }
  .hero-ball svg, .fly-ball svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .fly-ball { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; will-change: transform; }
  @media (min-width: 700px) {
    .hero-body { grid-template-columns: minmax(0, 1fr) 220px; grid-template-areas: "title kaya" "info kaya"; column-gap: 28px; }
    .hero h1 { max-width: 11em; }
    .hero-kaya { max-width: none; margin-right: 0; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .hero-kaya { opacity: 0; }
    .hero-kaya.ready { animation: rise 700ms var(--ease-out) 450ms both; }
    @keyframes rise { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
  }
  .hook { font-size: clamp(18px, 4.4vw, 24px); line-height: 1.3; margin: 18px 0 0; font-weight: 500; max-width: 34ch; }
  .facts { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: 6px 28px; margin: 30px 0 0; padding: 0; }
  .facts div { min-width: 0; }
  .facts dt { font-size: 14px; color: rgba(255,255,255,.72); }
  .facts dd { margin: 0; font-weight: 700; font-size: 17px; }
  @media (max-width: 699px) { .facts { grid-template-columns: 1fr; gap: 12px; margin-top: 24px; } .progress { margin-top: 22px; } }
  .progress { margin: 26px 0 0; max-width: 420px; }
  .progress p { margin: 0 0 8px; font-size: 15px; font-variant-numeric: tabular-nums; }
  .track { height: 8px; border-radius: 99px; background: rgba(255,255,255,.18); overflow: hidden; }
  .fill { height: 100%; width: 100%; background: #fff; border-radius: 99px; transform-origin: left; transform: scaleX(0);
          transition: transform 900ms var(--ease-out); }
  .cta { display: inline-block; margin-top: 30px; background: var(--red); color: #fff; text-decoration: none; border-radius: 12px;
         padding: 17px 24px; font-weight: 700; font-size: 17px; line-height: 1; transition: transform 140ms var(--ease-out), background-color 160ms ease; }
  .cta:active { transform: scale(.97); background: var(--red-press); }
  @media (max-width: 699px) { .cta { display: block; text-align: center; padding: 16px 10px; font-size: 16px; } }

  /* ───────── Sections ───────── */
  section { margin-top: 64px; }
  h2 { font-size: clamp(34px, 8vw, 50px); margin: 0 0 14px; }
  .lede { color: var(--muted); margin: 0 0 22px; max-width: 58ch; }

  /* Kaya */
  .kaya { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 16px 18px; align-items: center; }
  .portrait { margin: 0; }
  .portrait .frame { aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; background: #000091; }
  .portrait img { width: 100%; height: 100%; object-fit: cover; }
  .kaya .ph { font-size: 40px; }
  .kaya h2 { margin: 0; }
  .kaya p { grid-column: 1 / -1; margin: 0; max-width: 62ch; text-wrap: pretty; }
  .kstats { grid-column: 1 / -1; margin: 6px 0 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 2px solid var(--ink); }
  .kstats div { padding: 12px 10px 12px 0; border-bottom: 1px solid var(--line); }
  .kstats dd { margin: 0; font-stretch: var(--condensed); font-weight: 900; font-size: 44px; line-height: 1; color: var(--ball-sel); font-variant-numeric: tabular-nums; }
  .kstats dd small { font-size: 20px; font-weight: 800; margin-left: 4px; font-stretch: 85%; }
  .kstats dt { margin-top: 4px; font-size: 15px; line-height: 1.3; color: var(--muted); }
  @media (min-width: 640px) {
    .kaya { grid-template-columns: 190px minmax(0, 1fr); gap: 14px 34px; align-items: start; }
    .portrait { grid-row: 1 / span 3; }
    .kaya h2 { align-self: end; }
    .kaya p, .kstats { grid-column: 2; }
    .kstats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  /* Court-line divider between sections: a line with a centre circle */
  .mark { position: relative; height: 1.5px; margin: 64px 0 0; background: var(--line); border: 0; overflow: visible; }
  .mark::after { content: ""; position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; translate: -50% -50%; border: 1.5px solid var(--line); border-radius: 50%; background: var(--page); }
  .mark + section, .mark + main > section:first-child { margin-top: 56px; }
  /* Photo placeholder (photo not uploaded yet / failed to load) */
  .ph { width: 100%; height: 100%; display: grid; place-items: center; background:
        linear-gradient(transparent calc(50% - 1px), rgba(255,255,255,.22) calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px)), #000091;
        color: rgba(255,255,255,.5); font-stretch: var(--condensed); font-weight: 900; font-size: 64px; }

  /* Prizes */
  /* Prize cards (collector-card style). Every size inside a card is a multiple of --u = card width / 600,
     so the card looks identical at any width. */
  .deck { display: grid; gap: 24px; justify-items: center; margin-top: 8px; }
  @media (min-width: 700px) { .deck { grid-template-columns: repeat(2, minmax(0, 390px)); justify-content: start; gap: 28px; } }
  .pcard { width: 100%; max-width: 390px; aspect-ratio: 600 / 840; container-type: inline-size; perspective: 1000px; touch-action: pan-y; }
  .pface { --u: .58px; position: relative; height: 100%; padding: calc(var(--u) * 14); border-radius: calc(var(--u) * 30); background: #000091;
           box-shadow: 0 calc(var(--u) * 16) calc(var(--u) * 38) rgba(0, 0, 60, .2);
           transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform 600ms var(--ease-out); }
  @supports (width: 1cqw) { .pface { --u: calc(100cqw / 600); } }
  .pcard.tilting .pface { transition: transform 90ms linear; will-change: transform; }
  .pface::before { content: ""; position: absolute; inset: calc(var(--u) * 7); border-radius: calc(var(--u) * 24); border: 1.5px solid rgba(255, 255, 255, .35); pointer-events: none; }
  .pin { position: relative; height: 100%; display: flex; flex-direction: column; overflow: hidden; border-radius: calc(var(--u) * 20); background: #fff; color: #0a0a3c; }
  .glare { position: absolute; inset: 0; z-index: 4; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity 350ms ease;
           background: radial-gradient(circle at var(--gx, 50%) var(--gy, 50%), rgba(255, 255, 255, .5), rgba(255, 255, 255, .12) 35%, rgba(255, 255, 255, 0) 60%); }
  .pcard.tilting .glare { opacity: 1; }
  .phead { padding: calc(var(--u) * 20) calc(var(--u) * 26) calc(var(--u) * 14); }
  .plot { display: inline-block; background: #e1000f; color: #fff; font-weight: 800; font-size: calc(var(--u) * 19); line-height: 1; letter-spacing: .02em;
          padding: calc(var(--u) * 8) calc(var(--u) * 13) calc(var(--u) * 7); border-radius: calc(var(--u) * 8); }
  .pcard h3 { margin: calc(var(--u) * 12) 0 calc(var(--u) * 6); font-stretch: 70%; font-weight: 900; font-size: calc(var(--u) * 70); line-height: .88; letter-spacing: -.01em; color: #000091; }
  .tstar { display: inline-block; width: .5em; height: .5em; margin: 0 .04em 0 .02em; vertical-align: .32em; }
  .tstar svg { display: block; width: 100%; height: 100%; fill: #000091; }
  .pplace { font-size: calc(var(--u) * 21); line-height: 1.2; font-weight: 600; color: #55587a; }
  .pphoto { position: relative; flex: 1 0 calc(var(--u) * 236); min-height: calc(var(--u) * 236); background: #000091; }
  .pphoto > img, .pphoto > .ph { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pphoto .ph { font-size: calc(var(--u) * 80); }
  .plogo { position: absolute; z-index: 2; right: calc(var(--u) * 18); bottom: calc(var(--u) * -34); width: calc(var(--u) * 96); height: calc(var(--u) * 96);
           border-radius: calc(var(--u) * 16); overflow: hidden; background: #fff; border: calc(var(--u) * 4) solid #fff; box-shadow: 0 calc(var(--u) * 6) calc(var(--u) * 18) rgba(0, 0, 60, .22); }
  .plogo img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .psticker { position: absolute; z-index: 2; top: calc(var(--u) * -30); right: calc(var(--u) * 16); width: calc(var(--u) * 122); height: calc(var(--u) * 122);
              display: grid; place-items: center; border-radius: 50%; background: #e1000f; color: #fff; border: calc(var(--u) * 5) solid #fff;
              box-shadow: 0 calc(var(--u) * 8) calc(var(--u) * 20) rgba(150, 0, 10, .35), 0 0 0 calc(var(--u) * 3) #e1000f; transform: rotate(-12deg);
              font-stretch: 65%; font-weight: 900; font-size: calc(var(--u) * 66); line-height: 1; letter-spacing: -.02em; }
  .ptag { padding: calc(var(--u) * 16) calc(var(--u) * 26) calc(var(--u) * 14); max-width: calc(var(--u) * 470); font-size: calc(var(--u) * 22); font-weight: 800; font-stretch: 88%; line-height: 1.15; }
  .pstats { margin: calc(var(--u) * 2) calc(var(--u) * 18) 0; border-top: calc(var(--u) * 3) solid #0a0a3c; }
  .prow { display: flex; justify-content: space-between; align-items: center; gap: calc(var(--u) * 10); padding: calc(var(--u) * 6) calc(var(--u) * 12) calc(var(--u) * 5); border-bottom: 1px solid #dfe3f3; }
  .prow:nth-child(even) { background: #f3f5ff; }
  .prow { min-height: calc(var(--u) * 60); }
  .prow > span { font-size: calc(var(--u) * 22); line-height: 1.2; font-weight: 600; color: #55587a; }
  .prow b { font-stretch: 72%; font-weight: 900; font-size: calc(var(--u) * 38); line-height: 1; color: #000091; white-space: nowrap; }
  .prow b small { margin-left: calc(var(--u) * 5); font-size: calc(var(--u) * 22); font-weight: 800; font-stretch: 85%; }
  .pstars { display: inline-flex; gap: calc(var(--u) * 3); vertical-align: middle; }
  .pstars svg { width: calc(var(--u) * 28); height: calc(var(--u) * 28); fill: #e1000f; }
  .pfoot { margin-top: auto; padding: calc(var(--u) * 10) calc(var(--u) * 26) calc(var(--u) * 20); display: flex; justify-content: space-between; align-items: center; gap: calc(var(--u) * 12);
           font-size: calc(var(--u) * 17); font-weight: 700; line-height: 1.3; }
  .pflag { display: flex; flex-shrink: 0; width: calc(var(--u) * 64); height: calc(var(--u) * 8); border-radius: 2px; overflow: hidden; }
  .pflag i { flex: 1; } .pflag i:nth-child(1) { background: #000091; } .pflag i:nth-child(2) { background: #fff; box-shadow: inset 0 0 0 1px #dfe3f3; } .pflag i:nth-child(3) { background: #e1000f; }
  /* The cards are dealt onto the page the first time the section comes into view */
  @media (prefers-reduced-motion: no-preference) {
    .deck:not(.dealt) .pcard { opacity: 0; transform: translateY(48px) rotate(var(--deal, -5deg)); }
    .deck.dealt .pcard { transition: transform 750ms var(--ease-out), opacity 420ms ease; transition-delay: calc(var(--i, 0) * 140ms); }
  }
  /* Photos fade in when they finish loading instead of popping in */
  img.fade { opacity: 0; transition: opacity 320ms ease; }
  img.fade.on { opacity: 1; }
  .rules { color: var(--muted); font-size: 15px; margin: 18px 0 0; max-width: 60ch; }

  /* Grid */
  .steps { list-style: none; margin: 0 0 22px; padding: 0; display: grid; gap: 10px; counter-reset: st; }
  .steps li { counter-increment: st; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; align-items: start; line-height: 1.35; }
  .steps li::before { content: counter(st); display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--page);
                      font-stretch: var(--condensed); font-weight: 900; font-size: 18px; line-height: 1; }
  .steps li span { padding-top: 4px; }
  @media (min-width: 700px) { .steps { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; } }
  .tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 14px; margin: 0 0 14px; }
  .jump { display: flex; gap: 6px; }
  .jump button, .lucky { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 9px 13px; font: 700 14px/1 Archivo, sans-serif;
                         font-variant-numeric: tabular-nums; cursor: pointer; transition: transform 120ms var(--ease-out), border-color 150ms ease, background-color 150ms ease; }

/* Photo with a placeholder if the file is missing or fails to load */
function photo(src, alt, fallback) {
  const ph = el('div', 'ph', fallback);
  if (!src) return ph;
  const img = new Image();
  img.alt = alt; img.loading = 'lazy'; img.decoding = 'async'; img.className = 'fade';
  img.addEventListener('load', () => img.classList.add('on'));
  img.addEventListener('error', () => img.replaceWith(ph));
  img.src = src;
  if (img.complete && img.naturalWidth) img.classList.add('on');
  return img;
}

/* A prize card tilts towards the pointer / finger and a soft shine follows it */
function tiltable(card) {
  if (reduceMotion) return;
  let raf = 0, last = null;
  const apply = () => {
    raf = 0;
    if (!last) return;
    const r = card.getBoundingClientRect();
    const px = Math.min(1, Math.max(0, (last.x - r.left) / r.width)), py = Math.min(1, Math.max(0, (last.y - r.top) / r.height));
    card.style.setProperty('--ry', ((px - .5) * 14).toFixed(2) + 'deg');
    card.style.setProperty('--rx', ((.5 - py) * 10).toFixed(2) + 'deg');
    card.style.setProperty('--gx', (px * 100).toFixed(1) + '%');
    card.style.setProperty('--gy', (py * 100).toFixed(1) + '%');
  };
  const move = (e) => { last = { x: e.clientX, y: e.clientY }; card.classList.add('tilting'); if (!raf) raf = requestAnimationFrame(apply); };
  const rest = () => { last = null; card.classList.remove('tilting'); card.style.setProperty('--rx', '0deg'); card.style.setProperty('--ry', '0deg'); };
  card.addEventListener('pointermove', move);
  card.addEventListener('pointerdown', move);
  ['pointerleave', 'pointerup', 'pointercancel'].forEach((t) => card.addEventListener(t, rest));
}

/* Deal the cards in the first time the prize section is seen */
function watchDeck() {
  const deck = $('deck');
  if (reduceMotion || !('IntersectionObserver' in window)) { deck.classList.add('dealt'); return; }
  const io = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) { deck.classList.add('dealt'); io.disconnect(); } }, { threshold: .18 });
  io.observe(deck);
}

/* Small fade for content that swaps in (so nothing appears abruptly) */
function fadeIn(node, ms) {
  if (!reduceMotion && node.animate) node.animate([{ opacity: 0 }, { opacity: 1 }], { duration: ms || 280, easing: 'ease-out' });
}

/* ── "Pick my numbers": smooth scroll down to the grid, then the numbers ripple ── */
let passing = false;
function passToGrid() {
  const maxScroll = document.documentElement.scrollHeight - innerHeight;
  const endY = Math.min(maxScroll, $('numbers').getBoundingClientRect().top + scrollY - 12);
  window.scrollTo({ top: endY, behavior: reduceMotion ? 'auto' : 'smooth' });
  if (reduceMotion || passing) return;
  passing = true;
  const cells = $('grid').children, top0 = cells[0].offsetTop;
  let cols = 0; while (cols < cells.length && cells[cols].offsetTop === top0) cols++;
  const idx = Math.min(cells.length - 1, cols + Math.floor(cols / 2));
  let last = -1, still = 0;
  const wait = () => {                       // ripple once the scroll has settled
    if (Math.abs(scrollY - last) < 1) still++; else still = 0;
    last = scrollY;
    if (still < 3) return requestAnimationFrame(wait);
    ripple(idx); passing = false;
  };
  requestAnimationFrame(wait);
}

/* The ball lands and the numbers bounce outwards from where it hit */
function ripple(idx) {
  const cells = $('grid').children, o = cells[idx].getBoundingClientRect();
  const ox = o.left + o.width / 2, oy = o.top + o.height / 2;
  for (let i = 0; i < cells.length; i++) {
    const r = cells[i].getBoundingClientRect();
    if (r.bottom < -50 || r.top > innerHeight + 50) continue;
    const d = Math.hypot(r.left + r.width / 2 - ox, r.top + r.height / 2 - oy);
    if (d > 700) continue;
    const amp = 8 * (1 - d / 700);
    cells[i].animate([
      { transform: 'translateY(0)' },
      { transform: `translateY(${-amp}px) scale(${1 + amp / 120})`, offset: .4 },
      { transform: 'translateY(0)' },
    ], { duration: 380, delay: d * .55, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' });
  }
}

function buildCurrencies() {

function toggle(n) {
  if (!taken || taken[n]) return;
  if (sel.has(n)) sel.delete(n);
  else {
    if (sel.size >= CFG.maxPerOrder) { setStatus('errMax', { max: CFG.maxPerOrder }, true); return; }
    sel.add(n);
    hop($('grid').children[n - 1]);
    if (statusMsg.err) setStatus(null);
    $('formerr').textContent = '';
    render();
    flyToPicked(n);
    return;
  }
  arriving.delete(n);
  if (statusMsg.err) setStatus(null);
  $('formerr').textContent = '';
  render();
}

/* A short bounce when a ball is picked (not on un-pick: removing should feel instant) */
function hop(cell) {
  if (reduceMotion || !cell || !cell.animate) return;
  cell.animate([
    { transform: 'translateY(0) scale(1)' },
    { transform: 'translateY(-7px) scale(1.06)', offset: .4 },
    { transform: 'translateY(0) scale(.96)', offset: .75 },
    { transform: 'translateY(0) scale(1)' },
  ], { duration: 320, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' });
}

/* A blue netball showing a number */
const arriving = new Set();           // numbers whose ball is still flying in
function bball(n, tag, cls) {
  const b = el(tag, 'bball ' + cls);
  b.dataset.n = n;
  b.append(el('i', 'sm'), String(n));
  if (arriving.has(n)) b.classList.add('arriving');
  return b;
}

/* The chosen ball flies from the grid into "Your numbers" (or into the bottom bar when the form is out of view) */
function flyToPicked(n) {
  const cell = $('grid').children[n - 1];
  const inForm = formInView;
  const target = inForm ? $('chips').querySelector(`[data-n="${n}"]`)
                        : ($('minis').querySelector(`[data-n="${n}"]`) || $('minis').querySelector('.more') || $('minis'));
  if (reduceMotion || !cell || !target || !cell.animate) return;
  const a = cell.getBoundingClientRect(), t = target.getBoundingClientRect();
  let ty = t.top;
  if (!inForm) {                                  // the bar may still be sliding up: aim at where it will settle
    const bar = $('bar'), br = bar.getBoundingClientRect();
    ty -= br.top - (innerHeight - bar.offsetHeight);
  }
  const size = a.width, endScale = t.width / size;
  const fx = el('span', 'bball fly-num'); fx.append(el('i', 'sm'), String(n));
  fx.style.setProperty('--s', size + 'px');
  document.body.appendChild(fx);
  arriving.add(n);
  target.classList.add('arriving');
  const x0 = a.left, y0 = a.top, x1 = t.left + (t.width - size) / 2, y1 = ty + (t.height - size) / 2;
  const lift = Math.min(90, Math.abs(y1 - y0) * .25 + 30);
  const mid = (k) => `translate(${x0 + (x1 - x0) * k}px, ${y0 + (y1 - y0) * k - lift * Math.sin(Math.PI * k)}px)`;
  fx.animate([
    { transform: `${mid(0)} scale(1) rotate(0deg)` },
    { transform: `${mid(.25)} scale(${1 + (endScale - 1) * .25 + .08}) rotate(-90deg)` },
    { transform: `${mid(.5)} scale(${1 + (endScale - 1) * .5 + .1}) rotate(-180deg)` },
    { transform: `${mid(.75)} scale(${1 + (endScale - 1) * .75 + .05}) rotate(-270deg)` },
    { transform: `${mid(1)} scale(${endScale}) rotate(-360deg)` },
  ], { duration: 460, easing: 'cubic-bezier(0.77, 0, 0.175, 1)', fill: 'forwards' }).finished.then(() => {
    fx.remove();
    arriving.delete(n);
    document.querySelectorAll(`.bball[data-n="${n}"]`).forEach((b) => {
      b.classList.remove('arriving');
      b.animate([{ transform: 'scale(1.18)' }, { transform: 'scale(1)' }], { duration: 220, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' });
    });
  });
}

function setStatus(key, vars, err) { statusMsg = { key, vars, err: !!err }; renderStatus(); }
function renderStatus() {
  const s = $('status');
  s.textContent = statusMsg.key ? tr(statusMsg.key, statusMsg.vars) : '';
  s.classList.toggle('err', statusMsg.err);
}

function render() {
  const cells = $('grid').children;
  let count = 0;
  for (let i = 0; i < cells.length; i++) {
    const n = i + 1, b = cells[i];
    const isTaken = !!(taken && taken[n]);
    if (isTaken) count++;
    b.disabled = !taken || isTaken;
    b.classList.toggle('sel', sel.has(n));
    b.setAttribute('aria-pressed', sel.has(n) ? 'true' : 'false');
  }
  $('grid').classList.toggle('loading', !taken);

  $('progress').hidden = !taken;
  if (taken) {
    $('progressText').textContent = tr('progress', { taken: count, total: CFG.total });
    $('fill').style.transform = 'scaleX(' + Math.min(1, count / CFG.total) + ')';
  }

  const nums = [...sel].sort((a, b) => a - b);
  const chips = $('chips'); chips.textContent = '';
  if (!nums.length) chips.appendChild(el('span', 'empty', tr('noneYet')));
  nums.forEach((n) => {
    const c = bball(n, 'button', 'chip'); c.type = 'button';
    c.setAttribute('aria-label', (lang === 'fr' ? 'Retirer le ' : 'Remove ') + n);
    c.addEventListener('click', () => toggle(n)); chips.appendChild(c);
  });
  const MAX_MINIS = 6, minis = $('minis'); minis.textContent = '';
  nums.slice(0, MAX_MINIS).forEach((n) => minis.appendChild(bball(n, 'span', 'mini')));
  if (nums.length > MAX_MINIS) minis.appendChild(el('span', 'more', '+' + (nums.length - MAX_MINIS)));
  const total = nums.length * CFG.price + ' ' + currency;
  $('totalVal').textContent = total;
  $('barTotal').textContent = (nums.length === 1 ? tr('count1') : tr('countN', { n: nums.length })) + ', ' + total;
  $('bar').classList.toggle('show', nums.length > 0 && !formInView && $('done').hidden);
  $('submit').disabled = busy;
  $('submit').textContent = busy ? tr('sending') : tr('submit');
}

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach((e) => { e.textContent = tr(e.dataset.t); });
  document.querySelectorAll('.lang button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false'));
  const cur = CFG.currencies;
  // price shown as "10 €, £, CHF": symbols where there is one, euro first
  const SYM = { EUR: '€', GBP: '£', CHF: 'CHF' }, ORDER = ['EUR', 'GBP', 'CHF'];
  const curShown = cur.slice().sort((a, b) => (ORDER.indexOf(a) + 1 || 9) - (ORDER.indexOf(b) + 1 || 9)).map((c) => SYM[c] || c).join(', ');
  $('priceVal').textContent = CFG.price + '\u00a0' + curShown;
  $('drawVal').textContent = CFG.drawDate[lang] || CFG.drawDate.fr || '…';
  const priceTxt = CFG.price + '\u00a0' + curShown;
  $('steps').replaceChildren(...[tr('step1', { max: CFG.maxPerOrder, price: priceTxt }), tr('step2'), tr('step3')].map((t) => { const li = el('li'); li.appendChild(el('span', null, t)); return li; }));
  $('lucky').textContent = tr('lucky');
  const jump = $('jump'); jump.textContent = '';
  for (let a = 1; a <= CFG.total; a += 100) {
    const b = el('button', null, a + '–' + Math.min(CFG.total, a + 99)); b.type = 'button';
    b.addEventListener('click', () => $('grid').children[a - 1].scrollIntoView({ behavior: scrollBehavior, block: 'start' }));
    jump.appendChild(b);
  }
  jump.hidden = CFG.total <= 100;
  $('note').textContent = CFG.holdHours > 0 ? tr('note', { h: CFG.holdHours }) : tr('noteNoHold');
  renderContent();
  renderStatus();
  render();
}

/* ── Backend ── */
async function api(method, payload) {
  const url = API_URL + (method === 'GET' ? '?action=state&t=' + Date.now() : '');
  const res = await fetch(url, method === 'GET' ? { cache: 'no-store' } : {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // plain text avoids a CORS preflight Apps Script can't answer
    body: JSON.stringify(payload),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

let configLoaded = false;
async function load() {
  if (!API_URL) { $('setup').hidden = false; setStatus('loadErr', null, true); return; }
  try {
    const d = await api('GET');
    if (d.config && !configLoaded) {
      const sameCur = d.config.currencies.join() === CFG.currencies.join();
      CFG = d.config; configLoaded = true;
      if (!CFG.currencies.includes(currency)) currency = CFG.currencies[0];
      if (!sameCur) { $('seg').textContent = ''; buildCurrencies(); }
      if ($('grid').children.length !== CFG.total) { $('grid').textContent = ''; buildGrid(); }
      applyLang();
    }
    taken = d.taken || {};
    const lost = [...sel].filter((n) => taken[n]);
    lost.forEach((n) => sel.delete(n));
    if (lost.length) setStatus('errTaken', { nums: lost.join(', ') }, true);
    else if (statusMsg.key === 'loading' || statusMsg.key === 'loadErr') setStatus(null);
    if (Object.keys(taken).length >= CFG.total) setStatus('soldOut');
    render();
  } catch (e) {
    console.error(e);
    if (!taken) setStatus('loadErr', null, true);
  }
}

let formInView = false;
new IntersectionObserver((entries) => { formInView = entries[0].isIntersecting; render(); }, { threshold: 0.15 }).observe($('form'));

const scrollBehavior = reduceMotion ? 'auto' : 'smooth';
$('lucky').addEventListener('click', () => {
  if (!taken) return;
  if (sel.size >= CFG.maxPerOrder) { setStatus('errMax', { max: CFG.maxPerOrder }, true); return; }
  const free = []; for (let n = 1; n <= CFG.total; n++) if (!taken[n] && !sel.has(n)) free.push(n);
  if (!free.length) return;
  const n = free[Math.floor(Math.random() * free.length)], cell = $('grid').children[n - 1];
  cell.scrollIntoView({ behavior: scrollBehavior, block: 'center' });
  setTimeout(() => { toggle(n); cell.classList.remove('found'); void cell.offsetWidth; cell.classList.add('found'); }, reduceMotion ? 0 : 450);
});

$('cta').addEventListener('click', (e) => { e.preventDefault(); passToGrid(); });
$('barBtn').addEventListener('click', () => {
  $('form').scrollIntoView({ behavior: scrollBehavior, block: 'start' });
  setTimeout(() => $('name').focus({ preventScroll: true }), reduceMotion ? 0 : 450);
});

$('form').addEventListener('submit', (e) => {
  e.preventDefault();
  if (busy) return;
  const err = (k, v) => { $('formerr').textContent = tr(k, v); };
  const name = $('name').value.trim();
  const email = $('email').value.trim();
  if (!API_URL) return err('loadErr');
  if (!sel.size) return err('errNone');
  if (!name) return err('errName');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return err('errEmail');
  $('formerr').textContent = '';

  busy = true; render();
  const numbers = [...sel].sort((a, b) => a - b);
  const cover = zoomIn(numbers[0]);                 // the ball fills the screen while the booking is sent
  // wait for the zoom to cover the screen and (briefly) for Kaya's animation to be ready
  const sheet = null;
  const settle = (fn) => (x) => Promise.all([cover ? cover.ready : null, sheet]).then(() => fn(x));
  api('POST', { action: 'reserve', numbers, name, email, currency, lang, website: $('website').value })
    .then(settle((res) => {
      busy = false;
      if (res && res.ok) {
        res.numbers.forEach((n) => { taken[n] = 'reserved'; });
        sel.clear();
        showDone(res, email, cover);
        return;
      }
      const code = res && res.code;
      if (code === 'taken') {
        if (res.taken) taken = res.taken;
        (res.numbers || []).forEach((n) => sel.delete(n));
        err('errTaken', { nums: (res.numbers || []).join(', ') });
      } else {
        err({ none: 'errNone', name: 'errName', email: 'errEmail', max: 'errMax', busy: 'errBusy' }[code] || 'errGeneric', { max: CFG.maxPerOrder });
      }
      render();
      if (cover) zoomBack(cover);
    }))
    .catch(settle((e2) => { console.error(e2); busy = false; err('errGeneric'); render(); if (cover) zoomBack(cover); }));
});

/* ── The big zoom: the first chosen ball grows until it fills the screen, then shrinks into the hoop ── */
const EASE_IO = 'cubic-bezier(0.77, 0, 0.175, 1)';
const ZOOM_IN = 760, ZOOM_OUT = 820;

function zoomIn(n) {
  if (reduceMotion || !Element.prototype.animate) return null;
  const chip = $('chips').querySelector(`[data-n="${n}"]`);
  const r = (chip || $('submit')).getBoundingClientRect();
  const size = chip ? r.width : 46;
  const D = Math.ceil(Math.hypot(innerWidth, innerHeight) * 1.06);
  const z = el('div', 'bball zoom');
  const num = el('span', 'znum', String(n));
  z.append(el('i', 'sm'), num);
  z.style.setProperty('--s', D + 'px');
  const kN = Math.min(1, (innerWidth * .62) / (.36 * D * .56 * String(n).length));
  const at = (x, y, sc, rot) => `translate(${x - D / 2}px, ${y - D / 2}px) scale(${sc}) rotate(${rot}deg)`;
  const from = { x: r.left + r.width / 2, y: r.top + r.height / 2, s: size / D };
  const mid = { x: innerWidth / 2, y: innerHeight / 2 };
  z.style.transform = at(from.x, from.y, from.s, 0);
  document.body.appendChild(z);
  if (chip) chip.style.visibility = 'hidden';
  const a = z.animate([
    { transform: at(from.x, from.y, from.s, 0) },
    { transform: at(mid.x, mid.y, 1, 0) },
  ], { duration: ZOOM_IN, easing: EASE_IO, fill: 'forwards' });
  num.animate([{ transform: 'scale(1)' }, { transform: `scale(${kN})` }], { duration: ZOOM_IN, easing: EASE_IO, fill: 'forwards' });
  const ready = a.finished.then(() => z.classList.add('waiting'));
  return { z, num, D, kN, at, mid, from, ready };
}

function zoomTo(cover, x, y, size, dur) {
  const { z, num, D, kN, at, mid } = cover;
  z.classList.remove('waiting');
  num.animate([{ transform: `scale(${kN})` }, { transform: 'scale(1)' }], { duration: dur, easing: EASE_IO, fill: 'forwards' });
  return z.animate([
    { transform: at(mid.x, mid.y, 1, 0) },
    { transform: at(x, y, size / D, -360) },
  ], { duration: dur, easing: EASE_IO, fill: 'forwards' }).finished.then(() => z.remove());
}

/* Booking failed: the ball shrinks back into "Your numbers" */
function zoomBack(cover) {
  const n = Number(cover.num.textContent);
  const chip = $('chips').querySelector(`[data-n="${n}"]`);
  if (chip) chip.style.visibility = 'hidden';
  const r = chip ? chip.getBoundingClientRect() : cover.from;
  const x = chip ? r.left + r.width / 2 : r.x, y = chip ? r.top + r.height / 2 : r.y, w = chip ? r.width : cover.from.s * cover.D;
  zoomTo(cover, x, y, w, 600).then(() => { if (chip) chip.style.visibility = ''; });
}

function showDone(res, email, cover) {
  $('main').hidden = true;
  $('done').hidden = false;
  $('doneNums').textContent = res.numbers.join(', ');
  $('doneBody').textContent = res.mailFailed ? tr('doneMailFail', { org: CFG.organiser || tr('organiser') }) : tr('doneBody', { email });
  $('doneHold').textContent = CFG.holdHours > 0 ? tr('doneHold', { h: CFG.holdHours, ref: res.ref }) : tr('doneRef', { ref: res.ref });
  $('payAmount').textContent = (res.total != null ? res.total : res.numbers.length * CFG.price) + ' ' + (res.currency || currency);
  $('payRef').textContent = res.ref;
  $('payByRow').hidden = !(CFG.holdHours > 0);
  $('payBy').textContent = CFG.holdHours + (lang === 'fr' ? ' heures' : ' hours');
  $('copyRef').textContent = tr('copy');
  lastShot = res.numbers.slice(0, 3);
  if (cover) {
    // Behind the full-screen ball: jump to the confirmation, then the ball zooms out into Kaya's hands; she turns and passes it in
    $('done').scrollIntoView({ behavior: 'auto', block: 'start' });
    render();
    const hands = shoot(lastShot, { hold: true });
    // start the zoom-out only once the confirmation page has been drawn behind the ball (two frames later), so it starts cleanly
    hands.ready.then(() => requestAnimationFrame(() => requestAnimationFrame(() => {
      hands.go(ZOOM_OUT);
      zoomTo(cover, hands.x, hands.y, hands.size, ZOOM_OUT);
    })));
    return;
  }
  fadeIn($('done'));
  $('done').scrollIntoView({ behavior: scrollBehavior, block: 'start' });
  render();
  shoot(lastShot, { startDelay: reduceMotion ? 0 : 650 });
}

const withTimeout = (p, ms, v) => Promise.race([p, new Promise((r) => setTimeout(() => r(v), ms))]);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* ── The goal scene: each reserved ball arcs up into the ring ── */
const NS = 'http://www.w3.org/2000/svg';
const EASE = 'cubic-bezier(0.23, 1, 0.32, 1)', FALL = 'cubic-bezier(.55,0,1,.45)';
const SCENE_W = 340, SCENE_H = 240, FLOOR = 228;               // FLOOR = where the court floor meets the back wall
const HANDS = { x: 70, y: 196, r: 22 };                         // where the ball starts (and where the zoomed-out ball lands)
const RING = { x: 246, y: 64, rx: 21, ry: 5.5 }, NET = 30, POST_X = 246;
const FAR = .5;                                                  // a ball at the ring looks half its size in her hands
let lastShot = [];
let sceneRun = 0;

function svgEl(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

function buildCourt(numbers) {
  const svg = svgEl('svg', { viewBox: `0 0 ${SCENE_W} ${SCENE_H}`, 'aria-hidden': 'true', style: 'overflow: hidden' });
  const defs = svgEl('defs', {}, svg);
  defs.innerHTML = '<radialGradient id="bselGrad" cx="34%" cy="28%" r="70%"><stop offset="12%" style="stop-color:var(--ball-sel-hi)"/><stop offset="100%" style="stop-color:var(--ball-sel)"/></radialGradient>' +
    '<clipPath id="bselClip"><circle r="11.3"/></clipPath>';
  // floor line, post, back half of the ring
  svgEl('line', { class: 'floor', x1: 0, y1: FLOOR, x2: SCENE_W, y2: FLOOR }, svg);
  svgEl('rect', { class: 'post', x: POST_X - 2.5, y: RING.y - 14, width: 5, height: FLOOR - RING.y + 14, rx: 2 }, svg);
  svgEl('path', { class: 'ring', d: `M${RING.x - RING.rx},${RING.y} A${RING.rx},${RING.ry} 0 0 1 ${RING.x + RING.rx},${RING.y}` }, svg);
  // balls: the first is drawn last so it sits on top
  const balls = numbers.map(() => null);
  for (let i = numbers.length - 1; i >= 0; i--) {
    const g = svgEl('g', { class: 'ball', opacity: 0, transform: `translate(${HANDS.x} ${HANDS.y}) scale(${HANDS.r / 11.4})` }, svg);
    const spin = svgEl('g', { class: 'spin' }, g);
    spin.innerHTML = selBallMarkup(numbers[i]);
    balls[i] = g;
  }
  // front half of the ring + net (in front of the balls)
  svgEl('path', { class: 'ring', d: `M${RING.x - RING.rx},${RING.y} A${RING.rx},${RING.ry} 0 0 0 ${RING.x + RING.rx},${RING.y}` }, svg);
  const R = RING.rx, x = RING.x, y = RING.y, nb = R * .55;
  const net = svgEl('path', { class: 'net', d:
    `M${x - R + 1},${y + 2} L${x - nb},${y + NET} L${x + nb},${y + NET} L${x + R - 1},${y + 2}` +
    ` M${x - R * .5},${y + 4} L${x - nb * .35},${y + NET} M${x},${y + 5} L${x},${y + NET} M${x + R * .5},${y + 4} L${x + nb * .35},${y + NET}` +
    ` M${x - R * .82},${y + NET * .38} L${x + R * .82},${y + NET * .38} M${x - R * .68},${y + NET * .7} L${x + R * .68},${y + NET * .7}` }, svg);
  const goal = svgEl('text', { class: 'goal', x: 120, y: 70, 'text-anchor': 'middle', opacity: 0 }, svg);
  goal.textContent = tr('goal');
  return { svg, balls, net, goal };
}

/* Throws ball i from her hands up through the ring (getting smaller as it goes away from us), then it drops to the floor */
const FLY = 1500;
function launch(sc, b, i, delay) {
  const k0 = HANDS.r / 11.4, k1 = k0 * FAR;
  const rest = { x: RING.x + 26 + i * 12, y: FLOOR - 11.4 * k1 + 1 };
  const ctrl = { x: (HANDS.x + RING.x) / 2 + 10, y: RING.y - 90 };
  const frames = [];
  for (let s = 0; s <= 20; s++) {                  // the arc, up to just above the ring
    const t = s / 20, u = 1 - t;
    const px = u * u * HANDS.x + 2 * u * t * ctrl.x + t * t * RING.x;
    const py = u * u * HANDS.y + 2 * u * t * ctrl.y + t * t * (RING.y - 6);
    frames.push({ transform: `translate(${px}px, ${py}px) scale(${k0 + (k1 - k0) * Math.sqrt(t)})`, offset: .55 * t });
  }
  frames.push({ transform: `translate(${RING.x}px, ${RING.y + NET - 4}px) scale(${k1})`, offset: .66, easing: FALL });
  frames.push({ transform: `translate(${RING.x + 8}px, ${rest.y}px) scale(${k1})`, offset: .82, easing: EASE });
  frames.push({ transform: `translate(${(RING.x + 8 + rest.x) / 2}px, ${rest.y - 14}px) scale(${k1})`, offset: .91, easing: FALL });
  frames.push({ transform: `translate(${rest.x}px, ${rest.y}px) scale(${k1})`, offset: 1 });
  b.removeAttribute('transform');
  b.animate(frames, { duration: FLY, delay, fill: 'both' });          // 'both': the ball waits in her hands until the shot
  b.querySelector('.spin').animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(-540deg)' }], { duration: FLY, delay, fill: 'both', easing: EASE });
  sc.net.animate([{ transform: 'scaleY(1)' }, { transform: 'scaleY(1.3)', offset: .4 }, { transform: 'scaleY(1)' }],
    { duration: 380, delay: delay + FLY * .58, easing: EASE });
  return delay + FLY * .58;
}

function scoreOnce(sc, at) {
  if (sc.scored) return;
  sc.scored = true;
  sc.goal.animate([{ opacity: 0, transform: 'scale(.85)' }, { opacity: 1, transform: 'scale(1)' }],
    { duration: 260, delay: at, fill: 'forwards', easing: EASE });
  setTimeout(celebrate, at);
}

function shoot(numbers, opts = {}) {
  const box = $('shot');
  box.setAttribute('aria-label', tr('replay'));
  const run = ++sceneRun;
  const sc = buildCourt(numbers);
  box.replaceChildren(sc.svg);

  // where the ball sits in her hands (screen position + size): the zoomed-out ball lands here
  const ctm = sc.svg.getScreenCTM();
  const pt = ctm ? new DOMPoint(HANDS.x, HANDS.y).matrixTransform(ctm) : { x: innerWidth / 2, y: innerHeight / 3 };
  const target = { x: pt.x, y: pt.y, size: 2 * HANDS.r * (ctm ? ctm.a : 1) };

  if (reduceMotion || !sc.svg.animate) {            // still picture: balls resting by the post
    const k1 = HANDS.r / 11.4 * FAR;
    sc.balls.forEach((b, i) => { b.setAttribute('opacity', 1); b.setAttribute('transform', `translate(${RING.x + 26 + i * 12} ${FLOOR - 11.4 * k1 + 1}) scale(${k1})`); });
    sc.goal.setAttribute('opacity', 1);
    target.go = () => {}; target.ready = Promise.resolve();
    return target;
  }

  // With opts.hold the scene waits for target.go(delay), so the page can draw it while the full-screen ball still covers everything
  let go;
  const started = opts.hold ? new Promise((r) => { go = r; }) : Promise.resolve(opts.startDelay || 0);
  target.go = go || (() => {});
  target.ready = Promise.resolve();

  (async () => {
    const d0 = await started;
    if (run !== sceneRun) return;
    const appear = (b, delay, pop) => b.animate(pop ? [{ opacity: 0 }, { opacity: 1 }] : [{ opacity: 1 }, { opacity: 1 }], { duration: pop ? 220 : 1, delay, easing: 'ease-out', fill: 'forwards' });
    let t = d0;
    sc.balls.forEach((b, i) => {
      if (i === 0) appear(b, t, false); else appear(b, t, true);
      t += i === 0 ? 250 : 300;                     // a short pause before each shot
      scoreOnce(sc, launch(sc, b, i, t));
      t += 520;
    });
  })();
  return target;
}

$('shot').addEventListener('click', () => { if (lastShot.length) shoot(lastShot); });

/* One celebration moment: tricolour confetti after a booking */
function celebrate() {
  if (reduceMotion || !Element.prototype.animate) return;
  const box = $('done'), w = box.clientWidth, colors = ['#000091', '#ffffff', '#e1000f'];
  for (let i = 0; i < 42; i++) {
    const c = el('i', 'confetti');
    c.style.left = Math.random() * w + 'px';
    c.style.background = colors[i % 3];
    if (i % 3 === 1) c.style.boxShadow = 'inset 0 0 0 1px #d9ddf2';
    box.appendChild(c);
    const drift = (Math.random() - .5) * 120, rot = (Math.random() - .5) * 720, fall = 260 + Math.random() * 260;
    c.animate([
      { transform: 'translate(0, 0) rotate(0deg)', opacity: 1 },
      { transform: `translate(${drift}px, ${fall}px) rotate(${rot}deg)`, opacity: 0 },
    ], { duration: 1300 + Math.random() * 700, delay: Math.random() * 180, easing: 'cubic-bezier(0.23, 1, 0.32, 1)', fill: 'forwards' })
      .finished.then(() => c.remove());
  }
}

$('copyRef').addEventListener('click', () => {
  const b = $('copyRef');
  const done = () => { b.textContent = tr('copied'); setTimeout(() => { b.textContent = tr('copy'); }, 1600); };
  if (navigator.clipboard) navigator.clipboard.writeText($('payRef').textContent).then(done, () => {});
});

$('again').addEventListener('click', () => {
  $('done').hidden = true; $('main').hidden = false; fadeIn($('main'), 320); load(); render();
  $('numbers').scrollIntoView({ behavior: scrollBehavior, block: 'start' });
});

document.querySelectorAll('.lang button').forEach((b) => b.addEventListener('click', () => { lang = b.dataset.lang; applyLang(); }));

setupArt();
watchDeck();
buildGrid();
buildCurrencies();
applyLang();
load();
setInterval(() => { if (!document.hidden && !busy && !$('main').hidden) load(); }, 20000);
